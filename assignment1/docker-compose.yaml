version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: notesapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespassword
    volumes:
      - notesapp-db-data:/var/lib/postgresql/data
    networks:
      - notesapp-network

  web:
    build: ./app
    container_name: notesapp-web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: notesapp-db
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: notespassword
    ports:
      - "5000:5000"
    networks:
      - notesapp-network

networks:
  notesapp-network:

volumes:
  notesapp-db-data:
